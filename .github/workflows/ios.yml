name: iOS

on:
  push:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version && swift --version
      - name: Test HyperCore (signing vs Python SDK vectors)
        working-directory: HyperCore
        run: swift test

  build-ipa:
    runs-on: macos-15
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Hype.xcodeproj \
            -scheme Hype \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|\*\* BUILD" || true
          test -f build/Build/Products/Release-iphoneos/Hype.app/Hype || { grep -E "error:" build.log | head -80; exit 1; }
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Hype.app Payload/
          zip -qry Hype.ipa Payload
          ls -lh Hype.ipa
          test $(stat -f%z Hype.ipa) -gt 100000
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hype-unsigned-ipa
          path: Hype.ipa
          retention-days: 30
