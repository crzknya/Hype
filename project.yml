name: Hype
options:
  bundleIdPrefix: com.hype
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  HyperCore:
    path: HyperCore
  reown:
    url: https://github.com/reown-com/reown-swift
    exactVersion: 2.3.2
targets:
  Hype:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: HyperCore
        product: HyperCore
      - package: reown
        product: WalletConnect
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hype
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.hype.trader.refresh]
        NSFaceIDUsageDescription: Unlock the app and confirm sensitive actions
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [https, rabby, metamask, trust, rainbow, wc]
        CFBundleURLTypes:
          - CFBundleURLName: com.hype.trader
            CFBundleURLSchemes: [hype]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hype.trader
        PRODUCT_NAME: Hype
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    scheme: {}
